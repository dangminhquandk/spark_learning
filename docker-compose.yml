services:
  spark-lab:
    build: .
    container_name: spark_graph_lab
    volumes:
      - .:/app
    ports:
      - "4040:4040"
      - "8888:8888"
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONPATH=/app
    stdin_open: true
    tty: true
    command: >
      bash -c "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''"
